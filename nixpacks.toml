# Force Python only — repo also contains Next.js under web/ for Vercel.
providers = ["python"]

# Railway / Nixpacks: install the lean API deps (skip Streamlit + HF datasets).
[phases.install]
cmds = ["pip install -r requirements-api.txt"]

[start]
cmd = "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
