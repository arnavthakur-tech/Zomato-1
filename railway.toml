[build]
builder = "NIXPACKS"
# Do NOT set buildCommand here — Railway runs it without the Python venv,
# which causes `pip: command not found`. Install is handled by nixpacks.toml.

[deploy]
startCommand = "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
